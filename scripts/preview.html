<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Origami preview renderer</title>
<style>html,body{margin:0;background:#FDF6E9}</style>
<script type="importmap">
{ "imports": {
  "three": "/node_modules/three/build/three.module.js",
  "three/addons/": "/node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const loader = new GLTFLoader();
const cache = new Map();
const load = (file) => {
  if (!cache.has(file)) cache.set(file, loader.loadAsync('/models/' + file).then((g) => g.scene));
  return cache.get(file);
};

// items: [{ file, x, z, ry }]; returns a PNG data URL.
window.renderScene = async ({ items, width = 512, height = 512, pad = 0.08, view = [1, 0.95, 1.3] }) => {
  const scene = new THREE.Scene();
  scene.background = new THREE.Color('#FDF6E9');
  for (const it of items) {
    const obj = (await load(it.file)).clone();
    obj.position.set(it.x ?? 0, it.y ?? 0, it.z ?? 0);
    obj.rotation.y = it.ry ?? 0;
    obj.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    scene.add(obj);
  }
  const box = new THREE.Box3().setFromObject(scene);
  const centre = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3()).length();

  scene.add(new THREE.HemisphereLight('#fffaf0', '#c9b79a', 1.6));
  const sun = new THREE.DirectionalLight('#ffffff', 2.2);
  sun.position.copy(centre).add(new THREE.Vector3(-0.6, 1.4, 0.9).normalize().multiplyScalar(size * 2));
  sun.target.position.copy(centre);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.bias = -0.0004;
  sun.shadow.normalBias = 0.004;
  sun.shadow.radius = 3;
  Object.assign(sun.shadow.camera, { left: -size, right: size, top: size, bottom: -size, near: 0.01, far: size * 5 });
  scene.add(sun, sun.target);

  // Orthographic camera fitted tightly to the bounding box corners.
  const dir = new THREE.Vector3(...view).normalize();
  const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.01, size * 10);
  cam.position.copy(centre).addScaledVector(dir, size * 3);
  cam.lookAt(centre);
  cam.updateMatrixWorld();
  const inv = cam.matrixWorldInverse;
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (let i = 0; i < 8; i++) {
    const p = new THREE.Vector3(i & 1 ? box.max.x : box.min.x, i & 2 ? box.max.y : box.min.y, i & 4 ? box.max.z : box.min.z).applyMatrix4(inv);
    minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x); minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
  }
  let w = maxX - minX, h = maxY - minY;
  const aspect = width / height;
  if (w / h > aspect) h = w / aspect; else w = h * aspect;
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2, k = 1 + pad * 2;
  Object.assign(cam, { left: cx - (w * k) / 2, right: cx + (w * k) / 2, top: cy + (h * k) / 2, bottom: cy - (h * k) / 2 });
  cam.updateProjectionMatrix();

  renderer.setPixelRatio(1);
  renderer.setSize(width, height);
  renderer.render(scene, cam);
  return renderer.domElement.toDataURL('image/png');
};

// Lays out already-rendered PNGs in a labelled grid.
window.contactSheet = async ({ tiles, cols, cell = 256, title }) => {
  const rows = Math.ceil(tiles.length / cols), head = 64, label = 30;
  const c = document.createElement('canvas');
  c.width = cols * cell; c.height = head + rows * (cell + label);
  const g = c.getContext('2d');
  g.fillStyle = '#FDF6E9'; g.fillRect(0, 0, c.width, c.height);
  g.fillStyle = '#3A3F4B'; g.font = 'bold 28px sans-serif'; g.textAlign = 'center';
  g.fillText(title, c.width / 2, 42);
  g.font = '18px sans-serif';
  for (let i = 0; i < tiles.length; i++) {
    const img = new Image();
    img.src = tiles[i].png;
    await img.decode();
    const x = (i % cols) * cell, y = head + Math.floor(i / cols) * (cell + label);
    g.drawImage(img, x, y, cell, cell);
    g.fillText(tiles[i].name, x + cell / 2, y + cell + 20);
  }
  return c.toDataURL('image/png');
};
window.ready = true;
</script>
</body>
</html>
