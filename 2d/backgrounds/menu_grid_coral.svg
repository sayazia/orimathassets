<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs>
<radialGradient id="bg" cx="0.3" cy="0.2" r="1.1"><stop offset="0" stop-color="#F37B75"/><stop offset="1" stop-color="#E16964"/></radialGradient>
<linearGradient id="face" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#F37872"/><stop offset="1" stop-color="#F2716B"/></linearGradient>
<filter id="lift" x="-20%" y="-30%" width="140%" height="170%">
