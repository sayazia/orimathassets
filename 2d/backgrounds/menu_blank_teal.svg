<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs>
<radialGradient id="bg" cx="0.3" cy="0.2" r="1.1"><stop offset="0" stop-color="#4CBBA7"/><stop offset="1" stop-color="#3BA995"/></radialGradient>
<linearGradient id="face" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#49BAA5"/><stop offset="1" stop-color="#3FB6A0"/></linearGradient>
